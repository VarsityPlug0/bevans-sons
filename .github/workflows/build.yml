name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://bevans-sons.onrender.com
          NEXT_PUBLIC_WHATSAPP: "27724816274"
          NEXT_PUBLIC_PHONE: "0724816274"
          NEXT_PUBLIC_EMAIL: MkhabeleEnterprise@gmail.com
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Commit .next build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .next/
          git diff --staged --quiet || git commit -m "chore: update .next build [skip ci]"
          git push
