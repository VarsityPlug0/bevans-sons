name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SITE_URL: https://bevans-sons.onrender.com
          NEXT_PUBLIC_WHATSAPP: "27724816274"
          NEXT_PUBLIC_PHONE: "0724816274"
          NEXT_PUBLIC_EMAIL: MkhabeleEnterprise@gmail.com
