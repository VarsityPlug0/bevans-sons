services:
  - type: web
    name: bevans-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: 86c85bd43d4b8c6605ba00bda9cadd4da7e67e8f786a8ab87a174432649a48f6
      - key: JWT_ADMIN_SECRET
        value: 070eda5f0a1e1d6ebf13ab54699c8855f46d70db0f4cbbd53951b5668725cbaf
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_ADMIN_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        value: https://bevans-client.onrender.com
      - key: ADMIN_URL
        value: https://bevans-admin.onrender.com
      - key: BACKEND_URL
        value: https://bevans-backend.onrender.com
      - key: PAYFAST_SANDBOX
        value: "true"
      - key: PAYFAST_MERCHANT_ID
        value: ""
      - key: PAYFAST_MERCHANT_KEY
        value: ""
      - key: PAYFAST_PASSPHRASE
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STORE_NAME
        value: Bevans Sons
      - key: STORE_EMAIL
        value: MkhabeleEnterprise@gmail.com
      - key: STORE_PHONE
        value: "0724816274"
      - key: STORE_REG
        value: 2023/116995/07
      - key: DATABASE_URL
        fromDatabase:
          name: bevans-db
          property: connectionString

  - type: web
    name: bevans-client
    runtime: node
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://bevans-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://bevans-client.onrender.com

  - type: web
    name: bevans-admin
    runtime: node
    region: oregon
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://bevans-backend.onrender.com

databases:
  - name: bevans-db
    region: oregon
    plan: free
    databaseName: sneaker_store
    user: sneaker
