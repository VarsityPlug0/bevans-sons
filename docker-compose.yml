version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sneaker_store
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: sneaker_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sneaker -d sneaker_store']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
